plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

base { archivesName = 'Auto-SprintPlus-1.3-MC-1.21.9-to-1.21.11' }
loom { mods { 'auto-sprint-plus' { sourceSet sourceSets.main } } }
sourceSets.main.java.srcDirs = [rootProject.file('src/main/java'), rootProject.file('src/variants/mouse-modern/java')]
sourceSets.main.resources.srcDirs = [rootProject.file('src/main/resources')]
dependencies {
    minecraft "com.mojang:minecraft:${modern_minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${modern_fabric_api_version}"
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'fabric_api_min_version', '0.134.1+1.21.9'
    filesMatching('fabric.mod.json') {
        expand version: project.version, loader_version: loader_version,
               minecraft_dependency: '>=1.21.9 <=1.21.11', fabric_api_min_version: '0.134.1+1.21.9'
    }
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
layout.buildDirectory = rootProject.layout.buildDirectory.dir('modern')
tasks.named('jar') { archiveVersion = '1.3-MC-1.21.9-to-1.21.11' }
