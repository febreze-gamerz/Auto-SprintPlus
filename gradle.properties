# ================================================================
# AUTO SPRINT+ - DEFAULT BUILD SETTINGS
# ================================================================
# Default target. To build another included profile, use:
#   ./gradlew build -Ptarget_mc=26.2
#
# Version-specific Minecraft/Loader/API values live in versions/*.properties.
# Add a new versions/<minecraft>.properties file when a new Minecraft
# version is released, then build with -Ptarget_mc=<minecraft>.
# ================================================================

org.gradle.jvmargs=-Xmx4G -XX:+UseG1GC
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Default profile (26.2)
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.153.0+26.2

mod_version=1.4
maven_group=com.febreze.autosprintplus
archives_base_name=Auto-SprintPlus
loom_version=1.17-SNAPSHOT
java_version=25

# Minimum Fabric API version used in generated fabric.mod.json.
fabric_api_min_version=0.153.0
