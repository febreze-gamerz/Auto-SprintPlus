plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

base { archivesName = 'Auto-SprintPlus-1.4-1.21-1.21.8' }
loom { mods { 'auto-sprint-plus' { sourceSet sourceSets.main } } }
sourceSets.main.java.srcDirs = [rootProject.file('src/main/java'), rootProject.file('src/variants/mouse-legacy/java')]
sourceSets.main.resources.srcDirs = [rootProject.file('src/main/resources')]
dependencies {
    minecraft "com.mojang:minecraft:${legacy_minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${legacy_fabric_api_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version, loader_version: loader_version,
               minecraft_dependency: '>=1.21 <=1.21.8', fabric_api_min_version: legacy_fabric_api_min_version
    }
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
layout.buildDirectory = rootProject.layout.buildDirectory.dir('legacy')
tasks.named('jar') { archiveVersion = '1.4-1.21-1.21.8' }
